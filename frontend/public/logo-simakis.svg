<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!--
    Geometric S logo for SIMAKIS
    Inspired by the reference image: interlocking chevron/parallelogram shapes
    Using the existing brand gradient: #1E40AF (dark blue) → #06B6D4 (cyan)
    
    The S is formed by:
    - Upper-left chevron pointing up-right (light blue)
    - Upper-right chevron pointing down-right (bright blue) 
    - Central diagonal connecting bar (light blue)
    - Lower-left chevron (bright blue)
    - Lower-right chevron pointing up-right (light blue)
    All with overlap intersections for depth
  -->

  <!-- Upper-left arm: angled parallelogram going from bottom-left to top-center -->
  <polygon points="30,95 55,40 100,40 75,95" fill="#60A5FA" />

  <!-- Upper-right arm: parallelogram going from top-center to right -->
  <polygon points="100,40 170,40 145,95 100,95" fill="#2563EB" />

  <!-- Central diagonal bar connecting upper-right to lower-left -->
  <polygon points="125,95 100,95 75,145 100,145" fill="#93C5FD" />

  <!-- Lower-left arm: parallelogram -->
  <polygon points="30,145 55,145 100,200 30,200" fill="#2563EB" />

  <!-- Lower-right arm: parallelogram -->
  <polygon points="100,145 145,145 170,200 100,200" fill="#60A5FA" />

  <!-- Overlap dark accent at top junction -->
  <polygon points="100,40 100,95 75,95" fill="#1E40AF" opacity="0.5" />

  <!-- Overlap dark accent at bottom junction -->
  <polygon points="100,145 125,145 100,200" fill="#1D4ED8" opacity="0.5" />
</svg>
